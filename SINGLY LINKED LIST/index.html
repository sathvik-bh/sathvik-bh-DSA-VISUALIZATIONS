<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singly Linked List Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Singly Linked List Visualizer</h1>
  <p>Insert, delete, search, traverse and reverse nodes, one step at a time.</p>
</header>
<main>
  <section class="card controls">
    <label>Value <input id="val" type="number" placeholder="e.g. 25"></label>
    <label>Position (starts at 0) <input id="pos" type="number" min="0" placeholder="e.g. 2"></label>
    <label>Step delay (ms) <input id="spd" type="range" min="150" max="1200" value="500"></label>
    <div class="grp"><h3>Insert</h3>
      <button data-op="insHead">At beginning</button>
      <button data-op="insTail">At end</button>
      <button data-op="insPos">At position</button>
    </div>
    <div class="grp"><h3>Delete</h3>
      <button data-op="delHead" class="danger">From beginning</button>
      <button data-op="delTail" class="danger">From end</button>
      <button data-op="delPos" class="danger">At position</button>
      <button data-op="delVal" class="danger">By value</button>
    </div>
    <div class="grp"><h3>Other</h3>
      <button data-op="search">Search value</button>
      <button data-op="traverse">Traverse</button>
      <button data-op="reverse">Reverse</button>
      <button data-op="clear" class="danger">Clear</button>
    </div>
  </section>
  <section class="card viz">
    <div class="info">
      <div>Length: <b id="i-len">0</b></div>
      <div>Head: <b id="i-head">NULL</b></div>
      <div>Tail: <b id="i-tail">NULL</b></div>
      <div>Empty: <b id="i-empty">Yes</b></div>
    </div>
    <div id="list"></div>
  </section>
  <div class="bottom">
    <section class="card"><h2>Operation log</h2><ul id="log"></ul></section>
    <section class="card"><h2>C code</h2><pre id="code"></pre><div id="cx"></div></section>
  </div>
</main>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
